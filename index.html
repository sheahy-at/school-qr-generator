<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School QR Code Generator</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
  .card { backdrop-filter: blur(10px); }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="card bg-white/95 rounded-2xl shadow-2xl p-8 max-w-lg w-full">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold text-gray-800">School QR Generator</h1>
      <p class="text-gray-600 mt-2">Create QR codes with custom text & design</p>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">QR Content (URL or text)</label>
        <textarea id="textInput" rows="2" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent" placeholder="https://school.edu or any text..."></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Label Text (optional)</label>
        <input id="labelInput" type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg" placeholder="e.g. Scan for Assignment">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Label Position</label>
          <select id="positionSelect" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
            <option value="none">No label</option>
            <option value="top">Above QR</option>
            <option value="bottom" selected>Below QR</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Label Size</label>
          <select id="fontSizeSelect" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
            <option value="18">Small</option>
            <option value="24" selected>Medium</option>
            <option value="32">Large</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">QR Color</label>
          <input type="color" id="colorInput" value="#000000" class="w-full h-10 border border-gray-300 rounded-lg">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Label Color</label>
          <input type="color" id="labelColorInput" value="#1f2937" class="w-full h-10 border border-gray-300 rounded-lg">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Background</label>
          <input type="color" id="bgColorInput" value="#ffffff" class="w-full h-10 border border-gray-300 rounded-lg">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">QR Size</label>
          <select id="sizeSelect" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
            <option value="200">Small (200px)</option>
            <option value="280" selected>Medium (280px)</option>
            <option value="360">Large (360px)</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Padding</label>
          <select id="paddingSelect" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
            <option value="10">Tight</option>
            <option value="20" selected>Normal</option>
            <option value="40">Spacious</option>
          </select>
        </div>
      </div>

      <button onclick="generateQR()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 rounded-lg transition">
        Generate QR Code
      </button>
    </div>

    <div id="preview" class="mt-6 flex justify-center"></div>

    <div id="downloadSection" class="mt-4 text-center hidden">
      <button onclick="downloadQR()" class="bg-green-600 hover:bg-green-700 text-white font-semibold px-6 py-2 rounded-lg">
        Download PNG
      </button>
    </div>

    <p class="text-center text-xs text-gray-500 mt-6">Made for school use • Works offline after first load</p>
  </div>

<script>
function generateQR() {
  const text = document.getElementById('textInput').value.trim();
  if (!text) {
    alert('Please enter some content for the QR code');
    return;
  }

  const label = document.getElementById('labelInput').value.trim();
  const position = document.getElementById('positionSelect').value;
  const fontSize = parseInt(document.getElementById('fontSizeSelect').value);
  const qrSize = parseInt(document.getElementById('sizeSelect').value);
  const qrColor = document.getElementById('colorInput').value;
  const labelColor = document.getElementById('labelColorInput').value;
  const bgColor = document.getElementById('bgColorInput').value;
  const padding = parseInt(document.getElementById('paddingSelect').value);

  const preview = document.getElementById('preview');
  preview.innerHTML = '<div id="tempqr"></div>';

  // Generate QR first
  new QRCode(document.getElementById('tempqr'), {
    text: text,
    width: qrSize,
    height: qrSize,
    colorDark: qrColor,
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });

  // Wait a moment for QR to render
  setTimeout(() => {
    const qrCanvas = document.querySelector('#tempqr canvas');
    if (!qrCanvas) return;

    const hasLabel = label && position !== 'none';
    const labelHeight = hasLabel ? fontSize + 20 : 0;
    const totalWidth = qrSize + padding * 2;
    const totalHeight = qrSize + padding * 2 + labelHeight;

    const finalCanvas = document.createElement('canvas');
    finalCanvas.width = totalWidth;
    finalCanvas.height = totalHeight;
    const ctx = finalCanvas.getContext('2d');

    // Background
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, totalWidth, totalHeight);

    // Calculate positions
    let qrY = padding;
    let textY = 0;

    if (hasLabel && position === 'top') {
      textY = padding + fontSize;
      qrY = padding + labelHeight;
    } else if (hasLabel && position === 'bottom') {
      qrY = padding;
      textY = padding + qrSize + fontSize + 10;
    }

    // Draw QR
    ctx.drawImage(qrCanvas, padding, qrY, qrSize, qrSize);

    // Draw label
    if (hasLabel) {
      ctx.fillStyle = labelColor;
      ctx.font = `bold ${fontSize}px system-ui, -apple-system, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, totalWidth / 2, textY);
    }

    preview.innerHTML = '';
    preview.appendChild(finalCanvas);
    document.getElementById('downloadSection').classList.remove('hidden');
  }, 100);
}

function downloadQR() {
  const canvas = document.querySelector('#preview canvas');
  if (!canvas) return;

  const link = document.createElement('a');
  link.download = 'school-qrcode.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

document.getElementById('textInput').addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.key === 'Enter') generateQR();
});
</script>
</body>
</html>
